name: Fetch data & Deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # 5 分鐘排程作為保底自動恢復
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch market data
        env:
          SITE_URL: https://johntsai0320.github.io/stock/
        run: node scripts/fetch-data.mjs
      - name: Commit updated data.json to force CDN cache purge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          git commit -m "Auto update market data [skip ci]" || echo "No changes to data.json"
          git push origin main || true
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Retrigger next run for high-frequency live cycle
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting 15 seconds before scheduling next high-frequency update run..."
          sleep 15
          gh workflow run deploy.yml --ref main || true


