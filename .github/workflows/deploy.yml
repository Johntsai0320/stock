name: Fetch data & Deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # 5 分鐘排程作為保底自動恢復
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch market data
        env:
          SITE_URL: https://johntsai0320.github.io/stock/
        run: node scripts/fetch-data.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Retrigger next run for 1-minute live cycle
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting 30 seconds before scheduling next 1-minute update run..."
          sleep 30
          gh workflow run deploy.yml --ref main || true

